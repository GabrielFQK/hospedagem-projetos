<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Repositório de Projetos</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #007bff;
            --accent-hover: #0056b3;
            --erro: #ff4d4f;
            --sucesso: #28a745;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 1.8rem; margin-bottom: 24px; }
        .caixa {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 28px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            margin-top: 16px;
        }
        label:first-of-type { margin-top: 0; }
        input[type="text"], input[type="password"], select, textarea {
            width: 100%;
            box-sizing: border-box;
            background-color: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            font-family: inherit;
        }
        textarea { resize: vertical; min-height: 90px; }
        .ajuda {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        button {
            width: 100%;
            margin-top: 22px;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: var(--accent-hover); }
        button:disabled { background-color: #444; cursor: not-allowed; }
        .mensagem {
            margin-top: 16px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }
        .mensagem.erro { background: rgba(255,77,79,0.15); color: var(--erro); display: block; }
        .mensagem.sucesso { background: rgba(40,167,69,0.15); color: var(--sucesso); display: block; }
        .escondido { display: none; }
        .topo-logado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .sair-btn {
            width: auto;
            margin-top: 0;
            background: none;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: normal;
        }
        .checkbox-linha {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
        }
        .checkbox-linha input { width: auto; }
        .checkbox-linha label { margin: 0; }
        .radio-linha {
            display: flex;
            gap: 16px;
            margin-top: 6px;
        }
        .radio-linha label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-main);
        }
        .radio-linha input { width: auto; }
    </style>
</head>
<body>
    <h1>Painel Admin</h1>

    <!-- Login -->
    <div class="caixa" id="caixa-login">
        <label for="senha">Senha</label>
        <input type="password" id="senha" autocomplete="current-password">
        <button id="btn-login" onclick="fazerLogin()">Entrar</button>
        <div class="mensagem" id="msg-login"></div>
    </div>

    <!-- Painel logado -->
    <div class="caixa escondido" id="caixa-painel">
        <div class="topo-logado">
            <strong>Atualizar projeto</strong>
            <button class="sair-btn" onclick="sair()">Sair</button>
        </div>

        <label>O que você quer fazer?</label>
        <div class="radio-linha">
            <label><input type="radio" name="acao" value="atualizar" checked onchange="alternarAcao()"> Atualizar existente</label>
            <label><input type="radio" name="acao" value="criar" onchange="alternarAcao()"> Criar novo projeto</label>
        </div>

        <div id="bloco-existente">
            <label for="projeto-id">Projeto</label>
            <select id="projeto-id"></select>
        </div>

        <div id="bloco-novo" class="escondido">
            <label for="novo-nome">Nome do projeto</label>
            <input type="text" id="novo-nome" placeholder='Ex.: Extensão - Nome do Projeto'>

            <label for="novo-tipo">Tipo</label>
            <select id="novo-tipo">
                <option value="programa">Programa</option>
                <option value="extensao">Extensão</option>
            </select>

            <label for="novo-descricao">Descrição</label>
            <textarea id="novo-descricao" style="min-height: 60px;"></textarea>
        </div>

        <label for="versao">Versão (ex.: v1.1.7)</label>
        <input type="text" id="versao">

        <label for="changelog">O que mudou nessa versão</label>
        <textarea id="changelog" placeholder="Uma mudança por linha, ex.:&#10;Adicionado: Botão X.&#10;Corrigido: Erro Y."></textarea>
        <div class="ajuda">Uma linha por item. Vira a lista de novidades do card e entra no histórico.</div>

        <label for="link-download">Link de download</label>
        <input type="text" id="link-download" placeholder="https://github.com/.../arquivo.exe">
        <div class="ajuda">Suba o arquivo manualmente numa GitHub Release e cole o link direto aqui.</div>

        <label for="rotulo-botao">Texto do botão de download</label>
        <input type="text" id="rotulo-botao" placeholder="Baixar Programa (.exe)">

        <div class="checkbox-linha">
            <input type="checkbox" id="marcar-novo" checked>
            <label for="marcar-novo">Mostrar selo "Novo!" (remove dos outros projetos)</label>
        </div>

        <button id="btn-salvar" onclick="salvar()">Salvar e publicar</button>
        <div class="mensagem" id="msg-painel"></div>
    </div>

    <script>
        let PROJETOS = [];

        function mostrarMensagem(id, texto, tipo) {
            const el = document.getElementById(id);
            el.textContent = texto;
            el.className = 'mensagem ' + tipo;
        }

        async function fazerLogin() {
            const senha = document.getElementById('senha').value;
            const botao = document.getElementById('btn-login');
            botao.disabled = true;
            try {
                const resp = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ senha }),
                });
                if (!resp.ok) {
                    mostrarMensagem('msg-login', 'Senha incorreta.', 'erro');
                    return;
                }
                document.getElementById('caixa-login').classList.add('escondido');
                document.getElementById('caixa-painel').classList.remove('escondido');
                await carregarProjetos();
            } catch (e) {
                mostrarMensagem('msg-login', 'Erro ao conectar. Tente de novo.', 'erro');
            } finally {
                botao.disabled = false;
            }
        }

        function sair() {
            document.cookie = 'admin_session=; Max-Age=0; path=/';
            document.getElementById('caixa-painel').classList.add('escondido');
            document.getElementById('caixa-login').classList.remove('escondido');
        }

        async function carregarProjetos() {
            const resp = await fetch('projetos.json', { cache: 'no-store' });
            const dados = await resp.json();
            PROJETOS = dados.projetos || [];
            const select = document.getElementById('projeto-id');
            select.innerHTML = PROJETOS.map(p => `<option value="${p.id}">${p.nome}</option>`).join('');
            select.onchange = preencherCamposDoProjeto;
            preencherCamposDoProjeto();
        }

        function preencherCamposDoProjeto() {
            const id = document.getElementById('projeto-id').value;
            const p = PROJETOS.find(x => x.id === id);
            if (!p) return;
            document.getElementById('link-download').value = p.linkDownload || '';
            document.getElementById('rotulo-botao').value = p.rotuloBotao || '';
            document.getElementById('versao').value = '';
            document.getElementById('changelog').value = '';
        }

        function alternarAcao() {
            const criar = document.querySelector('input[name="acao"]:checked').value === 'criar';
            document.getElementById('bloco-existente').classList.toggle('escondido', criar);
            document.getElementById('bloco-novo').classList.toggle('escondido', !criar);
        }

        async function salvar() {
            const acao = document.querySelector('input[name="acao"]:checked').value;
            const versao = document.getElementById('versao').value.trim();
            const changelogTexto = document.getElementById('changelog').value.trim();
            const linkDownload = document.getElementById('link-download').value.trim();
            const rotuloBotao = document.getElementById('rotulo-botao').value.trim();
            const marcarNovo = document.getElementById('marcar-novo').checked;

            if (!versao || !changelogTexto || !linkDownload || !rotuloBotao) {
                mostrarMensagem('msg-painel', 'Preencha versão, changelog, link e texto do botão.', 'erro');
                return;
            }
            const mudancas = changelogTexto.split('\n').map(l => l.trim()).filter(Boolean);

            const payload = {
                acao,
                versao,
                mudancas,
                linkDownload,
                rotuloBotao,
                marcarNovo,
            };

            if (acao === 'atualizar') {
                payload.projetoId = document.getElementById('projeto-id').value;
            } else {
                payload.nome = document.getElementById('novo-nome').value.trim();
                payload.tipo = document.getElementById('novo-tipo').value;
                payload.descricao = document.getElementById('novo-descricao').value.trim();
                if (!payload.nome || !payload.descricao) {
                    mostrarMensagem('msg-painel', 'Preencha nome e descrição do novo projeto.', 'erro');
                    return;
                }
            }

            const botao = document.getElementById('btn-salvar');
            botao.disabled = true;
            botao.textContent = 'Publicando...';
            try {
                const resp = await fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify(payload),
                });
                if (resp.status === 401) {
                    mostrarMensagem('msg-painel', 'Sessão expirada, faça login de novo.', 'erro');
                    sair();
                    return;
                }
                if (!resp.ok) {
                    const erro = await resp.json().catch(() => ({}));
                    mostrarMensagem('msg-painel', 'Erro: ' + (erro.erro || resp.status), 'erro');
                    return;
                }
                mostrarMensagem('msg-painel', 'Publicado! O site atualiza em cerca de 1 minuto.', 'sucesso');
                await carregarProjetos();
            } catch (e) {
                mostrarMensagem('msg-painel', 'Erro ao conectar. Tente de novo.', 'erro');
            } finally {
                botao.disabled = false;
                botao.textContent = 'Salvar e publicar';
            }
        }
    </script>
</body>
</html>
